version: '3.8'

services:
  # Combined Deno backend + frontend
  ai-cinema:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-cinema
    ports:
      - "8000:8000"
    volumes:
      - ai-cinema-data:/data
      - ai-cinema-cache:/cache
    environment:
      - AI_CINEMA_HOME=/data
      - DENO_DIR=/cache
      - AI_CINEMA_PORT=8000
      - AI_CINEMA_LOG_LEVEL=info
      - SKIP_FRONTEND_BUILD=0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ai-cinema-data:
    driver: local
  ai-cinema-cache:
    driver: local
